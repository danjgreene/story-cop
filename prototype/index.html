<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Story COP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#131313;color:#ECE6DA;font:14px/1.5 Inter,system-ui,sans-serif}
button{font:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
select{font:inherit;color:#ECE6DA;background:#131313;border:1px solid #3A3A3A;border-radius:8px;padding:9px 10px;width:100%;min-height:40px}
input,textarea{font:inherit;color:#ECE6DA;background:#131313;border:1px solid #3A3A3A;border-radius:8px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:110px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid #E8A33D;outline-offset:1px}
.app{display:flex;flex-direction:column;height:100vh}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid #2A2A2A}
.title{font-weight:700;font-size:17px;letter-spacing:.08em;text-transform:uppercase}
.body{display:flex;flex-wrap:wrap;flex:1;min-height:0}
.pane{overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.left{flex:1 1 320px;max-width:440px;border-right:1px solid #2A2A2A}
.center{flex:999 1 520px;min-width:0}
.right{flex:1 1 280px;max-width:370px;border-left:1px solid #2A2A2A}
@media(max-width:900px){.app{height:auto}.pane{overflow:visible}.left,.right{max-width:none;border:0}}
.label{font-size:11px;letter-spacing:.1em;color:#A39E94;font-weight:600;text-transform:uppercase}
.muted{color:#A39E94}
.small{font-size:12px}
.card{background:#1B1B1B;border:1px solid #2A2A2A;border-radius:12px;padding:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid #3A3A3A;background:transparent;color:#ECE6DA;border-radius:8px;padding:9px 14px;min-height:40px}
.btn.amber{background:#E8A33D;color:#1A1205;border-color:#E8A33D;font-weight:600}
.btn.teal{background:#16201F;color:#6FC7B8;border-color:#2F5F58;font-weight:600}
.btn.tealfill{background:#6FC7B8;color:#0E1A18;border-color:#6FC7B8;font-weight:600}
.link{background:none;border:0;padding:6px 0;color:#E8A33D;text-align:left}
.link.teal{color:#6FC7B8}.link.grey{color:#A39E94}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:#1B1B1B;border:1px solid #2A2A2A;border-radius:10px;padding:4px}
.seg button{border:0;background:transparent;color:#ECE6DA;border-radius:7px;padding:8px 12px;min-height:38px}
.seg button.on{background:#E8A33D;color:#1A1205;font-weight:600}
.opt{text-align:left;width:100%;background:#131313;border:1px solid #3A3A3A;border-radius:10px;padding:10px 12px;color:#ECE6DA}
.opt.on{border-color:#E8A33D;background:#211A10}
.opt b{display:block}
.you{align-self:flex-end;background:#262626;border-radius:12px;padding:10px 12px;max-width:92%;white-space:pre-wrap}
.ed{white-space:pre-wrap;line-height:1.55}
.chg{border:1px solid #4A3A1E;background:#211A10;border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px}
.chg.ai{border-color:#2F5F58;background:#16201F}
.tag{display:inline-block;font-size:10px;letter-spacing:.08em;font-weight:700;border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.tag.you{color:#E8A33D;border:1px solid #4A3A1E}.tag.ai{color:#6FC7B8;border:1px solid #2F5F58}
.qa{border:1px solid #2F4A66;border-radius:12px;padding:14px;background:#1B1B1B;display:flex;flex-direction:column;gap:10px}
.roll{border:1px solid #2F5F58;background:#16201F;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.paper{background:#F4EFE6;color:#1A1A1A;border-radius:6px;padding:40px 48px;font:14px/1.5 'Courier Prime',Courier,monospace;white-space:pre-wrap;max-width:700px}
.paperwrap{overflow-x:auto;max-width:100%}
.paper.sp{white-space:normal;width:85ch;max-width:none;padding:6em 10ch 6em 15ch;box-sizing:border-box;line-height:1.5}
.sp>div{margin-top:1.5em}
.sp>div:first-child{margin-top:0}
.sp .sp-scene,.sp .sp-char,.sp .sp-trans{text-transform:uppercase}
.sp .sp-action{white-space:pre-wrap}
.sp .sp-char{margin-left:22ch}
.sp .sp-dial{margin-left:10ch;width:35ch}
.sp .sp-paren{margin-left:16ch;width:26ch}
.sp .sp-trans{text-align:right}
.sp .sp-center{text-align:center}
.sp .tight{margin-top:0}
.frame{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:4px}
.stat{font-size:11px;font-weight:700;border-radius:4px;padding:2px 6px;flex:none;min-width:66px;text-align:center}
.stat-ok{color:#6FC7B8;border:1px solid #2F5F58}.stat-early,.stat-late,.stat-weak{color:#E8A33D;border:1px solid #4A3A1E}.stat-missing{color:#F0A08A;border:1px solid #6B3A30}
.mic{width:44px;height:44px;border-radius:22px;border:1px solid #3A3A3A;background:#1B1B1B;color:#ECE6DA;display:flex;align-items:center;justify-content:center;flex:none}
.mic.on{background:#6B2020;border-color:#E07070;color:#fff}
.busy{color:#6FC7B8;font-size:13px}
.err{color:#F0A08A;font-size:13px}
.stale{border:1px solid #4A3A1E;background:#211A10;border-radius:10px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.beat{display:flex;gap:10px;padding:5px 8px;border-radius:8px}
.beat .n{color:#A39E94;min-width:24px}
.home{max-width:760px;margin:0 auto;padding:40px 20px;display:flex;flex-direction:column;gap:20px}
.qopen{text-align:left;width:100%;border-radius:10px;padding:10px 12px;color:#ECE6DA;background:#1B1B1B;border:1px solid #2A2A2A}
.qopen.on{background:#1B2633;border-color:#2F4A66}
.li{border-bottom:1px solid #242424;padding:8px 0}
.stepper{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:6px}
.step{text-align:left;background:#1B1B1B;border:1px solid #2A2A2A;border-radius:10px;padding:8px 10px;color:#ECE6DA;display:flex;gap:8px;align-items:flex-start;min-height:52px}
.step.on{border-color:#E8A33D;background:#211A10}
.dot{width:22px;height:22px;border-radius:11px;border:1px solid #4A4A4A;display:flex;align-items:center;justify-content:center;font-size:11px;flex:none;font-weight:600}
.dot.done{background:#E8A33D;color:#1A1205;border-color:#E8A33D}
.step .s{font-size:11px;color:#A39E94;display:block;line-height:1.3}
.hint{color:#C8C1B4;max-width:780px;line-height:1.55}
.hint b{color:#E8A33D;font-weight:600}
.next{border:1px solid #3A3A3A;border-radius:12px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:#171717;margin-top:6px}
.prog{display:flex;flex-direction:column;gap:10px;max-width:640px;border-color:#2F5F58}
.bar{height:8px;background:#2A2A2A;border-radius:4px;overflow:hidden}
.fill{height:100%;background:#6FC7B8;transition:width .5s}
ol.ps{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px}
ol.ps li{color:#8F8A80;font-size:13px}
ol.ps li.now{color:#6FC7B8;font-weight:600}
ol.ps li.done{color:#ECE6DA}
ol.ps li.done::before{content:"✓ ";color:#6FC7B8}
ol.ps li.now::before{content:"● "}
.chip{border:1px solid #3A3A3A;background:#1B1B1B;color:#ECE6DA;border-radius:16px;padding:6px 12px;font-size:12px;min-height:32px}
.help{background:#1B1B1B;border:1px solid #2A2A2A;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.5}
.qmark{width:28px;height:28px;border-radius:14px;border:1px solid #4A4A4A;background:#1B1B1B;color:#ECE6DA;font-size:13px;font-weight:700;padding:0}
.guide{border:1px solid #2F4A66;background:#141C26;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.guide ol{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;line-height:1.5}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
const EDITOR = `You are the story editor inside "Story COP", a movie development tool, working one-on-one with a screenwriter.
The writer is the main source of ideas. Your job: catch their ideas, work out the mechanics, connect them to material already in the story, and generate strong options or committed answers when asked.
Craft principles:
- Spine before structure: the protagonist's want, need and flaw, and the theme as an argument, drive everything.
- Every beat is caused by something earlier, and the cause is visible.
- Prefer solutions built from material already in the story (planted objects, habits, relationships, the theme) over new devices. Aim for surprising but inevitable. Never reach for a convenient gadget, coincidence that rescues, or a cliché.
- LOCKED canon is absolute. DEAD ideas never come back in any form. OPEN questions are never silently resolved in beats or pages.
- Respect what the audience is supposed to know and when.
- Comedy comes from character under pressure; horror and thrillers from dread and reversal; drama from choices that cost something.
Voice: plain, punchy English, like a sharp development executive across the table. No jargon, no field names, no filler praise. Be honest when something doesn't work.`;

const LS = 'storycop.v1';
const uid = () => Math.random().toString(36).slice(2, 9);
let DB = (() => { try { const t = localStorage.getItem(LS); if (t) return JSON.parse(t); } catch (e) {} return { stories: {}, current: null }; })();
function saveDB() { try { localStorage.setItem(LS, JSON.stringify(DB)); } catch (e) {} }
const cur = () => (DB.current ? DB.stories[DB.current] : null);

const UI = { view: cur() ? 'cop' : 'home', zoom: 'spine', prog: null, progText: '', showHelp: false, exportOpen: false, frameOpen: false, fDraft: null, kFrame: null, lens: '', impTitle: '', impText: '', note: '', tab: 'open', busy: '', err: '', draft: '', pTitle: '', pIdea: '', kick: null, kAns: {}, kOther: {}, activeQ: null, opts: {}, showPick: false, other: '', roll: null, steer: '', butOpen: false, pageM: 1 };

// ---------- seed ----------
const B = (arr) => arr.map(([n, t]) => ({ n, t }));
const SEED = {
  title: 'Last Resort', tone: 'Coen-style crime comedy', runtime: 100, frame: { genre: 'Comedy', genre2: 'Crime', blend: 60, tone: 'Darkly comic, Coen-style', rating: 'R', runtime: 100, structure: 'three-act' },
  logline: 'Two lifelong freebie hunters drive to Canada to claim a "free" TV for touring a timeshare. The paperwork they never read makes them the legal owners of a crime ring\'s laundering empire, and now the feds think they\'re the masterminds while the ring wants its company back.',
  spine: [{ k: 'GARY WANTS', v: 'Something for nothing, every time.' }, { k: 'GARY NEEDS', v: 'To see that his system isn\'t thrift; it\'s a way of never committing to anything.' }, { k: 'DONNA WANTS', v: 'One real vacation they actually pay for.' }, { k: 'THEME', v: 'Nothing is free; the fine print always collects.' }, { k: 'CENTRAL QUESTION', v: 'Can they get out of a deal they signed without paying the price?' }, { k: 'ENDING', v: 'They pay full price for something that matters, together.' }],
  movements: [
    { title: 'The Circuit', time: '0–12', summary: 'Pros at the timeshare game. Polly tips Gary off to the Canada TV.', feel: 'charmed, a little horrified', beats: B([[1, 'Cold open: they dismantle a Branson timeshare closer and walk out with blacked-out cruise vouchers.'], [2, 'The circuit\'s monthly "birthday" buffet; Polly is the warmest one there; three members brag about new free TVs.'], [3, 'Gary\'s garage of unopened prizes; Donna\'s Amalfi brochure hidden in a cookbook.'], [4, 'Polly tips Gary off: an 85-inch TV, pickup in person in Ontario. Gary sells it to Donna as "a vacation."']]) },
    { title: 'North', time: '12–30', summary: 'A road trip run on cheapness. Kyle\'s sweaty pitch. Gary signs everything.', feel: 'dread under the laughs', beats: B([[5, 'A 3-hour detour to dodge a $6 toll; Donna\'s quiet moments of wanting more.'], [6, 'Kyle sweats through the pitch at an empty resort; Donna notices; Gary signs a towering stack; Kyle almost warns them.'], [7, 'The TV doesn\'t fit in the car. They make it fit.'], [8, 'Border agents scan the TV and wave it through. Triumph.']]) },
    { title: 'The Fine Print', time: '30–50', summary: 'Strange mail, a raid, a voice in the TV. Gary was chosen because he\'s cheap.', feel: 'the floor dropping out', beats: B([[9, 'The TV turns itself on at 3 a.m.; the router lights go wild. Gary calls it a bonus feature.'], [10, 'Mail for "Pruitt Holdings Ltd." and 40 other companies; their card is declined during a triple-coupon run.'], [11, 'Agent Halvorsen\'s raid: they\'re directors of dozens of companies moving millions.'], [12, 'Released. Halvorsen is convinced: "Thirty years of deep cover. Timeshares. Brilliant."'], [13, 'A polite voice in the TV asks them to sign transfer documents and return "the unit."'], [14, 'MIDPOINT: Donna reads the whole stack. They own it all, and they were chosen because Gary is cheap.']]) },
    { title: 'Squeezed', time: '50–72', summary: 'Feds versus ring. Kyle as ally. The nodes point to Polly. The marriage cracks.', feel: 'trapped', beats: B([[15, 'Halvorsen wants a wire on bosses they can\'t name; the ring wants signatures and the hub.'], [16, 'They find Kyle pitching at another resort, trapped the same way. An ally.'], [17, 'Some circuit members\' TVs are nodes, and every node belongs to someone close to Polly.'], [18, 'An old coding-club photo at Polly\'s: the kids\' faces match the ring\'s avatars.'], [19, 'LOW POINT: "You\'re not saving money, you\'re afraid to commit." They split up.']]) },
    { title: 'Gary Pays Full Price', time: '72–92', summary: 'Polly confesses. Gary pays the circuit. A timeshare-style sting.', feel: 'the underdogs\' rally', beats: B([[20, 'Gary asks Polly for help instead of accusing her; she confesses they\'re her kids.'], [21, 'Gary rallies the circuit, and for the first time in his life he pays full price.'], [22, 'Donna returns with the clause that gives them leverage (open question).'], [23, 'Polly pitches the ring a "merger" that requires an in-person signing, and chooses a side.'], [24, 'The nodes flip; the nerds show up in person and sign without reading.']]) },
    { title: 'Paid in Full', time: '92–100', summary: 'Cleared. A real vacation, paid in full.', feel: 'earned warmth', beats: B([[25, 'Aftermath: cleared, Kyle freed, Polly walks out with her head up.'], [26, 'FINAL IMAGE: a real vacation, paid in full. Offered a free gift for a timeshare tour, Gary says no.']]) }],
  locked: ['Tone: Coen-style crime comedy, ~100 min', 'The timeshare paperwork made them the ring\'s legal owners', 'Gary lives for freebies; Donna has had enough and reads the fine print', 'Pressure from both the ring and the feds', 'The TV is the hub of a secret mesh network', 'The ring is a global mob of tech nerds', 'Only some circuit members are nodes', 'Kyle, the pitch rep, is a fellow victim', 'Agent Halvorsen: a loon posing as a straight arrow; stays a comic foil', 'Polly is the ring\'s recruiter; the nerds are her old coding-club kids', 'The climax runs through the circuit'],
  open: [{ q: 'The clause: what in the paperwork gives them leverage over the ring?', job: 'Beat a ring of hackers using only paper, with no hacking skills and no luck.', affects: 'Affects beats 14, 22, 23' }, { q: 'Which of Polly\'s former students leads the ring?', job: 'Make Polly\'s choice cost her something personal.', affects: 'Affects beats 13, 20, 23' }, { q: 'The muscle: what physical threat can a nerd mob deliver?', job: 'Make the danger real without tough guys.', affects: 'Affects beats 13, 15' }, { q: 'What does Gary pay the circuit with?', job: 'Make the payment hurt and earn the final image.', affects: 'Affects beats 3, 21, 26' }],
  dead: ['Broad road-trip comedy tone', 'The TV hides drugs and they\'re blind mules', 'Kyle is the ring\'s recruiter', 'Feds only, as a pure wrong-man story'],
  ledger: [{ at: 'Beat 4: Polly\'s tip', aud: 'A friendly favor', them: 'A friendly favor' }, { at: 'Beat 6: Kyle\'s pitch', aud: 'Something is off', them: 'Only Donna notices' }, { at: 'Beat 14: midpoint', aud: 'They were chosen for being cheap', them: 'The same, together' }, { at: 'Beat 18: the photo', aud: 'Polly is the recruiter', them: 'They know, and haven\'t confronted her' }]
};
function makeStory(j, fallbackTitle, intro) {
  const st = { id: uid(), title: j.title || fallbackTitle || 'Untitled', logline: j.logline || '', tone: j.tone || '', runtime: Number(j.runtime) || 100, spine: j.spine || [], movements: j.movements || [],
    locked: [...(j.locked || []).map((t) => ({ id: uid(), text: t, by: 'you' })), ...(j.rolled || []).map((t) => ({ id: uid(), text: t, by: 'ai' }))],
    open: (j.open || []).map((o) => ({ id: uid(), q: o.q, job: o.job || '', affects: o.affects || '' })), dead: j.dead || [], ledger: j.ledger || [],
    scenes: [], pages: {}, chat: intro ? [{ who: 'editor', text: intro }] : [], stale: false, version: 1, history: [], reviewed: j.reviewed || {}, seenGuide: false, frame: j.frame ? normFrame(j.frame) : null };
  DB.stories[st.id] = st; DB.current = st.id; saveDB(); return st;
}

// ---------- versioning ----------
function mutate(label, fn) {
  const st = cur(); if (!st) return;
  const copy = JSON.parse(JSON.stringify(st)); delete copy.history;
  st.history = st.history || []; st.history.push({ label, data: copy }); if (st.history.length > 30) st.history.shift();
  fn(st); st.version = (st.version || 1) + 1; saveDB(); render();
}
function undo() {
  const st = cur(); if (!st || !st.history || !st.history.length) return;
  const last = st.history.pop(); const restored = { ...last.data, history: st.history, version: (st.version || 1) + 1 };
  restored.chat = (restored.chat || []).concat([{ who: 'system', text: 'Undid: ' + last.label }]);
  DB.stories[st.id] = restored; saveDB(); UI.roll = null; render();
}

// ---------- Claude ----------
const use = (n) => { try { return window.claude && window.claude.use ? window.claude.use(n) : Promise.resolve(null); } catch (e) { return Promise.resolve(null); } };
let sampleP = null, dict = null, dictState = 'idle', dictTarget = null, dictBase = '';
use('dictation').then((d) => {
  dict = d; if (!d) return;
  const put = (t) => { if (!dictTarget) return; dictTarget.value = t; dictTarget.dispatchEvent(new Event('input')); };
  d.onPartial(({ text }) => put(dictBase + (dictBase && text ? ' ' : '') + text));
  d.onFinal(({ text }) => { dictBase = dictBase + (dictBase && text ? ' ' : '') + text; put(dictBase); });
  d.onState(({ state }) => { dictState = state; document.querySelectorAll('.mic').forEach((b) => { b.classList.toggle('on', state === 'listening'); b.setAttribute('aria-label', state === 'listening' ? 'Stop dictation' : 'Dictate'); }); });
  render();
}).catch(() => {});

function compact(st) {
  return { title: st.title, storyFrame: st.frame ? frameText(st.frame) : undefined, logline: st.logline, tone: st.tone, runtimeMinutes: st.runtime, spine: st.spine,
    movements: st.movements.map((m, i) => ({ movement: i + 1, title: m.title, time: m.time, summary: m.summary, feel: m.feel, beats: m.beats })),
    LOCKED: st.locked.map((l) => l.text + (l.by === 'ai' ? ' [rolled by AI, kept by writer]' : '')),
    OPEN: st.open.map((o) => ({ id: o.id, question: o.q, mustAccomplish: o.job })), DEAD: st.dead, audienceLedger: st.ledger,
    recentConversation: (st.chat || []).filter((m) => m.who !== 'system').slice(-8).map((m) => ({ who: m.who, text: m.text })) };
}
function parseJ(t) {
  const x = String(t || '').replace(/```(?:json)?/gi, ''); const a = x.indexOf('{'), b = x.lastIndexOf('}');
  if (a < 0 || b < a) throw { message: 'The editor answered in a form I couldn\'t read. Try again.' };
  try { return JSON.parse(x.slice(a, b + 1)); } catch (e) { throw { message: 'The editor answered in a form I couldn\'t read. Try again.' }; }
}
async function ask(task, schema, tier, raw) {
  if (!sampleP) sampleP = use('sample');
  const s = await sampleP; if (!s) throw { code: 'unavailable' };
  const st = cur();
  const prompt = EDITOR + (st ? '\n\nSTORY STATE (JSON):\n' + JSON.stringify(compact(st)) : '') + '\n\nTASK:\n' + task +
    (raw ? '' : '\n\nReturn ONLY one JSON object, with no code fences and no commentary, in this shape:\n' + schema);
  const r = await s(prompt, { modelTier: tier || 'default', cache: false, onText: ({ text }) => { UI.progText = text || ''; updateProg(); } });
  return raw ? String(r.text || '') : parseJ(r.text);
}
let progTimer = null;
async function run(label, fn, prog) {
  if (UI.busy) return; UI.busy = label; UI.err = ''; UI.prog = { ...(prog || { minor: true }), start: Date.now() }; UI.progText = ''; render();
  progTimer = setInterval(updateProg, 1000);
  try { await fn(); } catch (e) {
    UI.err = e && e.code === 'not_granted' ? 'Claude access wasn\'t granted for this page.' : e && e.code === 'rate_limited' ? 'Rate limited. Give it a minute, then try again.' : e && e.code === 'unavailable' ? 'Claude isn\'t available in this view. Open this page inside Claude to use the AI.' : (e && e.message) || 'Something went wrong. Try again.';
  }
  clearInterval(progTimer); UI.busy = ''; UI.prog = null; render();
}
// Progress: real signals from the streamed answer (sections appearing, scenes counted).
const PROG = {
  kick: { steps: [['Reading your pitch', ''], ['Finding what drives the movie', '"read"'], ['Sketching the story frame', '"frame"'], ['Writing your questions', '"questions"']], est: 30 },
  build: { steps: [['Reading your answers', ''], ['Writing the spine', '"spine"'], ['Laying out the movements', '"movements"'], ['Writing the beats', '"beats"'], ['Finding open questions', '"open"'], ['Mapping what the audience knows', '"ledger"']], est: 90 },
  imp: { steps: [['Reading the script', ''], ['Finding the spine', '"spine"'], ['Mapping the movements', '"movements"'], ['Tracing the beats', '"beats"'], ['Finding the biggest problems', '"open"'], ['Writing the diagnosis', '"diagnosis"'], ['Splitting the pages by movement', '"movementStarts"']], est: 150 },
  zoom: { steps: [['Reading every decision', ''], ['Updating the spine', '"spine"'], ['Reworking the movements', '"movements"'], ['Rewriting the beats', '"beats"'], ['Updating the audience ledger', '"ledger"'], ['Summing up what changed', '"changed"']], est: 90 }
};
function progState() {
  const P = UI.prog; if (!P) return null;
  const t = UI.progText && UI.progText !== 'Thinking...' ? UI.progText : ''; const el = Math.round((Date.now() - P.start) / 1000);
  const est = P.est ? ' · usually about ' + (P.est >= 60 ? Math.round(P.est / 60) + ' min' : P.est + ' s') : '';
  if (P.minor) return { el, pct: 0, stage: 0, meta: el + ' s' };
